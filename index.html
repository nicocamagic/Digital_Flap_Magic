<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Digital Flap</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>Digital Flap</h1>
            <span id="status">Iniciando...</span>
        </header>

        <main class="camera-container">

            <video
                id="video"
                autoplay
                playsinline>
            </video>

            <canvas id="overlay"></canvas>

        </main>

        <div class="controls">

            <button id="startCamera">
                📷 Iniciar cámara
            </button>

        </div>

    </div>

    <!-- OpenCV -->
    <script async
        src="https://docs.opencv.org/4.x/opencv.js">
    </script>

    <script src="app.js"></script>

</body>
</html>
